# =====================================================================
# OWASP VULNERABILITY LEARNING LAB
# WARNING: ALL VALUES BELOW ARE INTENTIONALLY INSECURE.
# DO NOT DEPLOY. EDUCATIONAL USE ONLY.
# =====================================================================

# Application
spring.application.name=vulnerable-spring-app
server.port=8080
# REMEDIATION (VULN-019): bind to localhost by default so the lab is
# not reachable from other hosts.  Operators must explicitly override
# server.address if they need a different binding.
server.address=127.0.0.1

# ---------------------------------------------------------------------
# REMEDIATION (OWASP A05:2021 - Security Misconfiguration /
#              OWASP A02:2021 - Cryptographic Failures):
# Secrets MUST be supplied at deploy time via environment variables.
# See SecretConfig.java.  No defaults are committed to source control.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:owaspdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# REMEDIATION (VULN-017): H2 console is OFF by default. Enable only in
# a local sandbox profile by setting H2_CONSOLE_ENABLED=true.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
# REMEDIATION (VULN-014): disallow remote connections to the H2
# console's web admin port even if it is enabled.
spring.h2.console.settings.web-admin-allow-others=false

# REMEDIATION (VULN-010 / VULN-013): secrets sourced from env vars.
# Example: APP_SECRET_API_KEY, APP_SECRET_DB_PASSWORD, APP_SECRET_JWT_SIGNING_KEY
app.secret.api.key=${APP_SECRET_API_KEY:}
app.secret.db.password=${APP_SECRET_DB_PASSWORD:}
app.secret.jwt.signing.key=${APP_SECRET_JWT_SIGNING_KEY:}

# JPA / Hibernate
# NOTE: ddl-auto=create is retained for the in-memory H2 learning lab
# because the schema must be (re)created on each fresh JVM start so
# DataSeeder can populate it.  In a real deployment this MUST be
# replaced with 'validate' (and Flyway / Liquibase for migrations);
# see Residual Risks (VULN-014).
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# REMEDIATION (VULN-014): disable verbose SQL logging that leaks
# parameter bindings (and therefore credentials / PII).
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=NONE

# REMEDIATION (A04:2021): reject unknown JSON fields on request DTOs
# so mass-assignment attempts (e.g. {"role":"ADMIN"}) are rejected
# before they reach the controller.
spring.jackson.deserialization.fail-on-unknown-properties=true

# REMEDIATION (A05:2021): don't leak stack traces or internal messages
# via Spring's default error attributes.
server.error.include-stacktrace=never
server.error.include-message=never
